version: "3.8"

services:
  nofake-api:
    build:
      context: .
      dockerfile: back/Dockerfile.backend
    container_name: nofake-api
    env_file:
      - .env
    ports:
      - "3001:3002"
    environment:
      - PORT=3002
      - DB_STORAGE_PATH=/data/database.sqlite
      - NODE_ENV=production
    volumes:
      - nofake_sqlite:/data
    networks:
      - nofake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nofake-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://nofake-api:3002
        VITE_KAKAO_REST_API_KEY: ${VITE_KAKAO_REST_API_KEY}
        VITE_KAKAO_REDIRECT_URI: ${VITE_KAKAO_REDIRECT_URI}
    container_name: nofake-web
    depends_on:
      nofake-api:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - nofake-network
    restart: unless-stopped
    environment:
      - NGINX_HOST=nofake-api
      - NGINX_PORT=3002

volumes:
  nofake_sqlite:
    driver: local

networks:
  nofake-network:
    driver: bridge
