version: "3.8"

services:
  nofake-api:
    build:
      context: .
      dockerfile: back/Dockerfile.backend
    container_name: nofake-api
    env_file:
      - .env
    ports:
      - "3001:3002"
    environment:
      - PORT=3002
      - DB_STORAGE_PATH=/data/database.sqlite
      - NODE_ENV=production
      - FABRIC_DOCKER=true
      - FABRIC_CONFIG_PATH=/fabric-config
    volumes:
      - nofake_sqlite:/data
      - /home/ubuntu/NOFAKE/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com:/fabric-config:ro
    networks:
      - nofake-network
      - fabric_test
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nofake-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_KAKAO_REST_API_KEY: ${VITE_KAKAO_REST_API_KEY}
        VITE_KAKAO_REDIRECT_URI: ${VITE_KAKAO_REDIRECT_URI}
        VITE_ROOT_ADMIN_WALLET: ${VITE_ROOT_ADMIN_WALLET}
    container_name: nofake-web
    depends_on:
      nofake-api:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - nofake-network
    restart: unless-stopped
    environment:
      - NGINX_HOST=nofake-api
      - NGINX_PORT=3002

volumes:
  nofake_sqlite:
    driver: local

networks:
  nofake-network:
    driver: bridge
  fabric_test:
    external: true
